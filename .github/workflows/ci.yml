name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck scripts/*.sh volumes/minio/init.sh

      - name: Generate .env
        run: ./scripts/gen-env.sh

      - name: Compose config is valid (default and all profiles)
        run: |
          docker compose config -q
          COMPOSE_PROFILES=realtime,functions,analytics,pooler docker compose config -q

      - name: Every image is pinned to an exact tag or digest
        run: |
          bad=0
          for img in $(COMPOSE_PROFILES=realtime,functions,analytics,pooler docker compose config --images | sort -u); do
            case "$img" in
              *@sha256:*) ;;
              *:latest|*:latest-*) echo "unpinned: $img"; bad=1 ;;
              */*:*|*:*) ;;
              *) echo "untagged: $img"; bad=1 ;;
            esac
          done
          exit $bad

      - name: Published ports bind to 127.0.0.1 only
        run: |
          COMPOSE_PROFILES=realtime,functions,analytics,pooler docker compose config --format json \
            | jq -e '[.services[].ports[]? | .host_ip] | all(. == "127.0.0.1")'

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Generate .env
        run: ./scripts/gen-env.sh COMPOSE_PROJECT_NAME=sbm-ci

      - name: Pull images
        run: docker compose pull --quiet

      - name: Start stack
        run: docker compose up -d

      - name: Wait for health
        run: ./scripts/wait-healthy.sh 300

      - name: Smoke test
        run: ./scripts/smoke.sh

      - name: Backup and restore round trip
        run: |
          ./scripts/backup.sh backups/ci
          RESTORE_YES=1 ./scripts/restore.sh backups/ci
          ./scripts/wait-healthy.sh 120
          ./scripts/smoke.sh

      - name: Memory footprint
        if: always()
        run: docker compose ps -q | xargs docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}'

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  profiles:
    # Boots every optional service to make sure the profiles stay healthy.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Generate .env with all profiles
        run: >
          ./scripts/gen-env.sh COMPOSE_PROJECT_NAME=sbm-ci-all
          COMPOSE_PROFILES=realtime,functions,analytics,pooler
          STUDIO_LOGS_ENABLED=true

      - name: Pull images
        run: docker compose pull --quiet

      - name: Start stack
        run: docker compose up -d

      - name: Wait for health
        run: ./scripts/wait-healthy.sh 600

      - name: Smoke test
        run: ./scripts/smoke.sh

      - name: Optional services answer
        run: |
          set -euo pipefail
          anon=$(sed -n 's/^ANON_KEY=//p' .env)
          echo "::add-mask::$anon"
          port=$(sed -n 's/^API_HOST_PORT=//p' .env)
          # Edge Functions: the bundled `hello` function
          curl -fsS -H "Authorization: Bearer $anon" "http://127.0.0.1:$port/functions/v1/hello" | tee /dev/stderr | grep -q 'Hello'
          # Supavisor: transaction-mode connection through the pooler
          tenant=$(sed -n 's/^POOLER_TENANT_ID=//p' .env)
          pport=$(sed -n 's/^POOLER_TRANSACTION_HOST_PORT=//p' .env)
          sed -n 's/^POSTGRES_PASSWORD=//p' .env > "$RUNNER_TEMP/pgpass"
          docker run --rm --network host -v "$RUNNER_TEMP/pgpass:/pgpass:ro" --entrypoint sh \
            supabase/postgres:17.6.1.136 -c "PGPASSWORD=\$(cat /pgpass) psql 'host=127.0.0.1 port=$pport user=postgres.$tenant dbname=postgres' -Atc 'select 1'" \
            | grep -qx 1 && echo "pooler OK"

      - name: Memory footprint
        if: always()
        run: docker compose ps -q | xargs docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}'

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
